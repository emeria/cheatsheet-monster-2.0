<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Cheat sheets, tools and links for Path of Exile, Path of Exile 2, Last Epoch and more." />
    <link rel="icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%logo192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Cheatsheet Monster by Thundersphinx</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <script>
      // Set the saved skin before the first paint (same rules as savedSkin() in ThemeSwitcher.js).
      (function () {
        var skin = 'dusk';
        try {
          var saved = localStorage.getItem('skin');
          var old = localStorage.getItem('theme');
          if (/^(dusk|midnight|ember|frost|light|parchment|grimoire|contrast)$/.test(saved)) skin = saved;
          else if (old === 'light' || old === 'normal') skin = 'light';
          else if (old !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches) skin = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-skin', skin);
      })();
    </script>

    <script>
      // 404.html sends unknown paths here as ?p=/poe#heist; put the real path back before the app starts.
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) window.history.replaceState(null, '', '%BASE_URL%' + p.replace(/^\//, ''));
      })();
    </script>

    <!-- Google Analytics. Page views are sent by the app on every route change (Layout.js). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S40E20R8VK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-S40E20R8VK', { send_page_view: false });
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
